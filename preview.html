<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>康宁大药房 · 小程序界面预览</title>
<style>
  :root{
    --primary:#12996f; --primary-dark:#0d7d5b; --primary-light:#e8f6f0;
    --danger:#e34d59; --text:#1f2329; --sub:#5c6670; --muted:#9aa3ab;
    --line:#eef0f2; --bg:#f4f6f5; --card:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    gap:48px; padding:40px 24px; background:#eef1f0;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text);
  }
  /* ---------- 手机外壳 ---------- */
  .phone{
    width:390px; height:780px; background:var(--bg); border-radius:44px;
    box-shadow:0 24px 64px rgba(16,40,32,.22), 0 0 0 10px #1b1f1d, 0 0 0 12px #2e3431;
    display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  .statusbar{
    height:34px; flex:0 0 34px; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; font-size:12px; font-weight:600; letter-spacing:.4px;
  }
  .navbar{
    height:44px; flex:0 0 44px; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600;
    position:relative;
  }
  .navbar .back{
    position:absolute; left:14px; top:0; height:44px; display:flex; align-items:center;
    font-size:20px; cursor:pointer; padding:0 6px;
  }
  .navbar.plain{ background:var(--primary); }
  .screen{ flex:1; overflow-y:auto; overflow-x:hidden; position:relative; }
  .screen::-webkit-scrollbar{ width:0; }
  .footer{ flex:0 0 auto; background:#fff; }
  .footer:empty{ display:none; }
  .tabbar{
    flex:0 0 58px; height:58px; background:#fff; display:flex;
    border-top:1px solid var(--line); padding-bottom:4px;
  }
  .tabbar.hide{ display:none; }
  .tabbar .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; font-size:10px; color:#8b9299; cursor:pointer; position:relative;
  }
  .tabbar .tab.on{ color:var(--primary); font-weight:600; }
  .tabbar .tab .ico{ font-size:19px; line-height:1; }
  .tabbar .tab .badge{
    position:absolute; top:6px; right:calc(50% - 22px); min-width:15px; height:15px;
    background:var(--danger); color:#fff; font-size:9px; line-height:15px; text-align:center;
    border-radius:8px; padding:0 3px;
  }

  /* ---------- 通用 ---------- */
  .card{ background:var(--card); border-radius:12px; margin:10px; padding:12px; }
  .card.flush{ padding:0; overflow:hidden; }
  .row{ display:flex; align-items:center; }
  .price{ color:var(--danger); font-weight:600; }
  .price .s{ font-size:11px; }
  .price .n{ font-size:17px; }
  .line-through{ color:var(--muted); font-size:11px; text-decoration:line-through; margin-left:4px; }
  .thumb{
    display:flex; align-items:center; justify-content:center; border-radius:8px;
    position:relative; overflow:hidden; flex:0 0 auto;
  }
  .btn{
    height:40px; border-radius:20px; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:500; cursor:pointer; border:none; width:100%;
    font-family:inherit;
  }
  .btn.primary{ background:var(--primary); color:#fff; }
  .btn.primary:active{ background:var(--primary-dark); }
  .btn.ghost{ background:#fff; color:var(--primary); border:1px solid var(--primary); }
  .btn.disabled{ background:#dfe3e6; color:#a9b1b8; }
  .tag{ display:inline-block; font-size:10px; line-height:1; padding:3px 5px; border-radius:3px; margin-right:4px; }
  .tag.green{ color:var(--primary); background:var(--primary-light); }
  .tag.orange{ color:#c2410c; background:#fff1e6; }
  .tag.blue{ color:#2563eb; background:#eaf1ff; }
  .empty{ padding:70px 20px; text-align:center; }
  .empty .ico{ font-size:46px; opacity:.5; }
  .empty .txt{ margin-top:10px; color:var(--muted); font-size:13px; }
  .empty .btn{ width:140px; margin:16px auto 0; }
  .footnote{ text-align:center; font-size:10px; color:#b6bdc4; line-height:1.6; padding:14px 24px 6px; }
  .bottombar{
    background:#fff; padding:8px 12px;
    display:flex; align-items:center; gap:8px; box-shadow:0 -2px 8px rgba(0,0,0,.05); z-index:5;
  }
  .pad-bottom{ height:64px; }

  /* ---------- 首页 ---------- */
  .searchwrap{
    display:flex; align-items:center; gap:8px; padding:8px 12px;
    background:linear-gradient(180deg,var(--primary) 0%,var(--primary) 60%,rgba(18,153,111,0) 100%);
    position:sticky; top:0; z-index:6;
  }
  .searchbox{ flex:1; height:34px; background:#fff; border-radius:17px; display:flex; align-items:center; padding:0 12px; gap:6px; }
  .searchbox input{ flex:1; border:none; outline:none; font-size:13px; font-family:inherit; background:transparent; }
  .searchbox input::placeholder{ color:#b6bdc4; }
  .carticon{ width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:19px; position:relative; cursor:pointer; }
  .cats{ display:flex; gap:6px; padding:6px 12px 10px; background:var(--primary); overflow-x:auto; }
  .cats::-webkit-scrollbar{ height:0; }
  .cat{ flex:0 0 auto; font-size:12px; color:rgba(255,255,255,.85); padding:5px 11px; border-radius:13px; cursor:pointer; }
  .cat.on{ background:#fff; color:var(--primary); font-weight:600; }
  .banners{ display:flex; gap:8px; padding:10px 10px 2px; overflow-x:auto; }
  .banners::-webkit-scrollbar{ height:0; }
  .banner{
    flex:0 0 260px; height:84px; border-radius:10px; padding:14px 12px; color:#fff;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  }
  .banner b{ font-size:14px; display:block; }
  .banner span{ font-size:10px; opacity:.88; display:block; margin-top:4px; }
  .banner em{ font-size:30px; font-style:normal; opacity:.9; }
  .promises{ display:flex; background:#fff; border-radius:10px; margin:10px; padding:10px 0; }
  .promises div{ flex:1; display:flex; flex-direction:column; align-items:center; font-size:10px; color:var(--sub); gap:3px; }
  .promises span{ font-size:14px; }
  .sechead{ display:flex; align-items:baseline; justify-content:space-between; padding:2px 14px 4px; }
  .sechead b{ font-size:15px; }
  .sechead span{ font-size:11px; color:var(--muted); }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px 10px 0; }
  .gitem{ background:#fff; border-radius:10px; padding:8px; cursor:pointer; }
  .gitem .thumb{ width:100%; height:104px; }
  .gitem .thumb .em{ font-size:38px; }
  .gitem .flag{ position:absolute; left:5px; top:5px; background:rgba(194,65,12,.92); color:#fff; font-size:9px; padding:2px 5px; border-radius:3px; }
  .gitem .name{ font-size:13px; font-weight:500; line-height:1.35; height:36px; margin-top:8px; overflow:hidden; }
  .gitem .spec{ font-size:10px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gitem .foot{ display:flex; align-items:center; justify-content:space-between; margin-top:7px; }
  .gitem .add{
    width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px; line-height:1; cursor:pointer;
  }

  /* ---------- 详情 ---------- */
  .hero{ height:250px; display:flex; align-items:center; justify-content:center; position:relative; }
  .hero .em{ font-size:100px; }
  .hero .flag{ position:absolute; left:12px; bottom:12px; background:rgba(194,65,12,.92); color:#fff; font-size:11px; padding:4px 8px; border-radius:4px; }
  .dtitle{ font-size:17px; font-weight:600; margin-top:8px; line-height:1.4; }
  .dsub{ font-size:12px; color:var(--muted); margin-top:4px; }
  .dsec{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; margin:14px 0 0; }
  .dsec:first-child{ margin-top:0; }
  .dsec i{ width:3px; height:13px; background:var(--primary); border-radius:2px; display:block; }
  .dtext{ font-size:12.5px; color:var(--sub); line-height:1.75; margin-top:6px; }
  .rxbox{ display:flex; gap:8px; margin:10px; padding:12px; background:#fff8f1; border:1px solid #ffdec2; border-radius:8px; }
  .rxbox .t{ font-size:12px; font-weight:600; color:#c2410c; }
  .rxbox .c{ font-size:11px; color:#8a6a52; line-height:1.7; margin-top:4px; }
  .barbtns{ display:flex; gap:6px; flex:1; }
  .barbtns .btn{ height:36px; font-size:13px; border-radius:18px; }
  .barico{ width:46px; display:flex; flex-direction:column; align-items:center; gap:1px; font-size:16px; cursor:pointer; position:relative; }
  .barico small{ font-size:9px; color:var(--sub); }

  /* ---------- 购物车 / 订单 ---------- */
  .check{
    width:20px; height:20px; border-radius:50%; border:1px solid #cfd6dc; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; cursor:pointer;
  }
  .check.on{ background:var(--primary); border-color:var(--primary); }
  .citem{ display:flex; align-items:center; gap:9px; padding:12px; position:relative; cursor:pointer; }
  .citem+.citem{ border-top:1px solid #f2f4f5; }
  .citem .thumb{ width:76px; height:76px; font-size:32px; }
  .cbody{ flex:1; min-width:0; }
  .cname{ font-size:13px; font-weight:500; line-height:1.35; }
  .cspec{ font-size:10.5px; color:var(--muted); margin-top:3px; }
  .cfoot{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .stepper{ display:flex; align-items:center; border:1px solid #e6eaed; border-radius:4px; overflow:hidden; }
  .stepper b{ width:24px; height:22px; display:flex; align-items:center; justify-content:center; background:#f7f9fa; font-size:13px; color:var(--sub); cursor:pointer; font-weight:400; }
  .stepper span{ width:32px; text-align:center; font-size:12px; }
  .cdel{ position:absolute; right:8px; top:8px; color:#c2c8ce; font-size:12px; cursor:pointer; padding:2px 4px; }
  .shiptip{ display:flex; align-items:center; gap:6px; background:var(--primary-light); color:var(--primary-dark); font-size:11.5px; padding:9px 12px; }
  .rxtip{ display:flex; gap:6px; background:#fff8f1; color:#8a6a52; font-size:11px; padding:8px 12px; line-height:1.6; }
  .sumline{ flex:1; text-align:right; }
  .sumline .l{ font-size:11px; color:var(--sub); }
  .sumline .s{ font-size:9.5px; color:var(--muted); }

  .tabs{ display:flex; background:#fff; position:sticky; top:0; z-index:6; overflow-x:auto; }
  .tabs::-webkit-scrollbar{ height:0; }
  .tabs .t{
    flex:0 0 auto; padding:12px 13px 10px; font-size:13px; color:var(--sub); cursor:pointer; position:relative;
  }
  .tabs .t.on{ color:var(--primary); font-weight:600; }
  .tabs .t.on::after{ content:''; position:absolute; left:50%; transform:translateX(-50%); bottom:3px; width:20px; height:3px; border-radius:2px; background:var(--primary); }
  .ohead{ display:flex; align-items:center; justify-content:space-between; padding:11px 12px; border-bottom:1px solid #f2f4f5; }
  .ohead .no{ font-size:10.5px; color:var(--muted); }
  .ohead .st{ font-size:12px; font-weight:600; }
  .st.unpaid{ color:var(--danger); } .st.undelivered{ color:#f59e0b; }
  .st.shipping{ color:#2563eb; } .st.done{ color:var(--primary); } .st.canceled{ color:var(--muted); }
  .oitem{ display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer; }
  .oitem+.oitem{ border-top:1px solid #f7f8f9; }
  .oitem .thumb{ width:58px; height:58px; font-size:26px; }
  .oitem .r{ margin-left:auto; text-align:right; font-size:12.5px; }
  .oitem .r small{ display:block; color:var(--muted); font-size:10px; margin-top:3px; }
  .ofoot{ display:flex; align-items:center; justify-content:space-between; padding:8px 12px 6px; border-top:1px solid #f2f4f5; }
  .ofoot .time{ font-size:10px; color:#b6bdc4; }
  .ofoot .total{ font-size:11px; color:var(--sub); }
  .oactions{ display:flex; justify-content:flex-end; gap:8px; padding:6px 12px 12px; }
  .obtn{ height:28px; padding:0 14px; border-radius:14px; border:1px solid #dfe3e6; font-size:11.5px; color:var(--sub); display:flex; align-items:center; cursor:pointer; background:#fff; }
  .obtn.p{ border-color:var(--primary); color:var(--primary); background:#f2fbf7; }

  /* ---------- 确认订单 ---------- */
  .addr{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .addr .n{ font-size:14px; font-weight:600; }
  .addr .p{ font-size:11px; color:var(--muted); margin-left:6px; }
  .addr .d{ font-size:11.5px; color:var(--sub); margin-top:4px; line-height:1.5; }
  .rowtitle{ font-size:13px; font-weight:600; margin-bottom:8px; }
  .upload{
    height:72px; border:1px dashed #d5dde3; border-radius:6px; background:#fafbfc;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font-size:12px; color:var(--muted); cursor:pointer;
  }
  .upload.ok{ border-color:var(--primary); background:var(--primary-light); color:var(--primary); }
  .upload .plus{ font-size:18px; line-height:1; }
  .note{ font-size:10px; color:#b6bdc4; margin-top:6px; line-height:1.6; }
  textarea.remark{
    width:100%; height:60px; border:none; background:#fafbfc; border-radius:6px; padding:8px;
    font-size:12.5px; font-family:inherit; resize:none; outline:none;
  }
  .feerow{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:12.5px; }
  .feerow .k{ color:var(--sub); }
  .feerow.total{ border-top:1px solid var(--line); margin-top:4px; padding-top:9px; }
  .feerow.total .k{ color:var(--text); font-weight:600; }

  /* ---------- 我的 / 登录 ---------- */
  .minehero{ background:linear-gradient(160deg,#12996f,#17ab7c 60%,#45c79c); padding:18px 14px 0; color:#fff; }
  .urow{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .avatar{
    width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.5); display:flex; align-items:center; justify-content:center; font-size:26px;
  }
  .urow .nm{ font-size:17px; font-weight:600; }
  .urow .sb{ font-size:11px; opacity:.86; margin-top:4px; }
  .quick{ display:flex; background:rgba(255,255,255,.16); border-radius:10px 10px 0 0; margin-top:16px; padding:11px 0; }
  .quick div{ flex:1; text-align:center; }
  .quick b{ font-size:16px; display:block; }
  .quick span{ font-size:10px; opacity:.86; }
  .otabs{ display:flex; padding:8px 0 13px; }
  .otabs div{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--sub); position:relative; cursor:pointer; }
  .otabs .i{ font-size:21px; }
  .otabs .b{ position:absolute; top:-2px; right:calc(50% - 20px); min-width:15px; height:15px; background:var(--danger); color:#fff; font-size:9px; line-height:15px; text-align:center; border-radius:8px; padding:0 3px; }
  .menu .mi{ display:flex; align-items:center; gap:8px; padding:13px 12px; font-size:13px; cursor:pointer; }
  .menu .mi+.mi{ border-top:1px solid #f2f4f5; }
  .menu .mi .ar{ margin-left:auto; color:#c2c8ce; font-size:15px; }
  .logout{ margin:14px 10px 0; background:#fff; border-radius:10px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--danger); font-size:13px; cursor:pointer; }

  .brand{ display:flex; flex-direction:column; align-items:center; padding:36px 0 22px; }
  .brand .logo{
    width:68px; height:68px; border-radius:18px; background:linear-gradient(135deg,#12996f,#45c79c);
    display:flex; align-items:center; justify-content:center; font-size:32px;
    box-shadow:0 8px 20px rgba(18,153,111,.28);
  }
  .brand b{ font-size:17px; margin-top:12px; }
  .brand span{ font-size:11px; color:var(--muted); margin-top:5px; }
  .avatars{ display:flex; gap:8px; margin-bottom:4px; }
  .av2{
    width:40px; height:40px; border-radius:50%; background:var(--bg); display:flex; align-items:center;
    justify-content:center; font-size:19px; border:1px solid transparent; cursor:pointer;
  }
  .av2.on{ border-color:var(--primary); background:var(--primary-light); }
  .field{ display:flex; align-items:center; border-bottom:1px solid #f2f4f5; padding:13px 0 10px; }
  .field label{ width:60px; font-size:13px; }
  .field input{ flex:1; border:none; outline:none; font-size:13px; font-family:inherit; background:transparent; }
  .agree{ display:flex; align-items:center; gap:6px; padding:16px 4px 0; font-size:12px; color:var(--sub); cursor:pointer; }
  .agree .link{ color:var(--primary); }
  .actions2{ margin-top:22px; display:flex; flex-direction:column; gap:11px; }

  @media (max-width:900px){ body{ padding:16px; } .phone{ transform-origin:top center; } }
</style>
</head>

      <div class="obtn p" onclick="A.ship('${o.no}')">模拟发货</div>`;
    if (o.status === 'shipping') return `<div class="obtn" onclick="A.again('${o.no}')">再次购买</div>
      <div class="obtn p" onclick="A.receive('${o.no}')">确认收货</div>`;
    if (o.status === 'done') return `<div class="obtn" onclick="A.again('${o.no}')">再次购买</div>`;
    return `<div class="obtn" onclick="A.again('${o.no}')">重新下单</div>`;
  };

  return `
  <div class="tabs">
    ${tabs.map(t => {
      const c = t.id === 'all' ? 0 : state.orders.filter(o => o.status === t.id).length;
      return `<div class="t ${state.orderTab===t.id?'on':''}" onclick="A.orderTab('${t.id}')">
        ${t.n}${c?`<span style="font-size:9px;color:#fff;background:var(--danger);border-radius:8px;padding:0 3px;margin-left:2px;vertical-align:top">${c}</span>`:''}
      </div>`;
    }).join('')}
  </div>

  ${list.length ? list.map(o => `
    <div class="card flush" style="margin-top:10px">
      <div class="ohead">
        <span class="no">${o.no}</span>
        <span class="st ${o.status}">${STATUS_TEXT[o.status]}</span>
      </div>
      ${o.items.map(it => {
        const g = byId(it.id);
        return `<div class="oitem" onclick="A.detail(${g.id})">
          ${img(g, 58)}
          <div style="flex:1;min-width:0">
            <div class="cname">${g.name}</div>
            <div class="cspec">${g.spec}</div>
            ${g.rx ? '<div class="tag orange" style="margin-top:4px">处方药</div>' : ''}
          </div>
          <div class="r">¥${m(g.price)}<small>×${it.count}</small></div>
        </div>`;
      }).join('')}
      <div class="ofoot">
        <span class="time">${o.timeText}</span>
        <span class="total">共 ${o.items.reduce((s,i)=>s+i.count,0)} 件，实付
          <span class="price"><span class="s">¥</span><span class="n" style="font-size:14px">${o.total}</span></span></span>
      </div>
      <div class="oactions">${actions(o)}</div>
    </div>`).join('') : `
    <div class="empty"><div class="ico">📦</div>
      <div class="txt">${state.orderTab==='all'?'还没有订单，去挑点家庭常备药吧':'该状态下暂无订单'}</div>
      <button class="btn primary" onclick="A.tab('home')">去逛逛</button></div>`}
  <div style="height:16px"></div>`;
}

  const c = k => state.orders.filter(o => o.status === k).length;
  const phoneMask = u ? u.phone.replace(/^(\d{3})\d{4}(\d{4})$/, '$1****$2') : '';

  return `
  <div class="minehero">
    <div class="urow" onclick="A.login()">
      <div class="avatar">${u ? u.avatar : '👤'}</div>
      <div style="flex:1">
        <div class="nm">${u ? u.nickname : '点击登录'}</div>
        <div class="sb">${u ? '已绑定 ' + phoneMask + ' · 普通会员' : '登录后可查看订单与用药记录'}</div>
      </div>
      ${u ? '' : '<span style="font-size:20px;opacity:.8">›</span>'}
    </div>
    <div class="quick">
      <div onclick="A.tab('cart')"><b>${cartCount()}</b><span>购物车</span></div>
      <div onclick="A.orderTab('all')"><b>${state.orders.length}</b><span>全部订单</span></div>
      <div onclick="A.toast('暂无可用优惠券')"><b>0</b><span>优惠券</span></div>
      <div onclick="A.toast('暂无问诊记录')"><b>0</b><span>问诊记录</span></div>
    </div>
  </div>

  <div class="card flush" style="margin-top:10px">
    <div class="sechead" style="padding:12px 12px 0">
      <b>我的订单</b>
      <span onclick="A.orderTab('all')" style="cursor:pointer">查看全部 ›</span>
    </div>
    <div class="otabs">
      ${[['unpaid','💰','待付款'],['undelivered','📦','待发货'],['shipping','🚚','待收货'],['done','✅','已完成']]
        .map(([k,i,t]) => `<div onclick="A.orderTab('${k}')"><span class="i">${i}</span>${t}
          ${c(k)?`<span class="b">${c(k)}</span>`:''}</div>`).join('')}
    </div>
  </div>

  <div class="card flush menu">
    <div class="mi" onclick="A.toast('演示项目使用内置示例地址')"><span>📍</span>收货地址<span class="ar">›</span></div>
    <div class="mi" onclick="A.toast('演示未接入互联网医院')"><span>💬</span>在线问诊 / 药师咨询<span class="ar">›</span></div>
    <div class="mi" onclick="A.toast('暂无可用优惠券')"><span>🎟️</span>优惠券<span class="ar">›</span></div>
    <div class="mi" onclick="A.help()"><span>❓</span>常见问题<span class="ar">›</span></div>
    <div class="mi" onclick="A.about()"><span>ℹ️</span>关于我们<span class="ar">›</span></div>
  </div>

  ${u ? `<div class="logout" onclick="A.logout()">退出登录</div>` : ''}

  <div class="footnote">
    本小程序为演示项目，商品、价格、资质信息均为示例数据，不提供真实药品销售服务。
    实际经营需取得《药品经营许可证》《互联网药品信息服务资格证书》等资质。
  </div>`;
}

/* ================= 页面：登录 ================= */
function renderLogin(){
  const avatars = ['🙂','🐻','🌿','🐱','🦊','🍀'];
  return `
  <div class="brand">
    <div class="logo">💊</div>
    <b>康宁大药房</b>
    <span>家庭常备药 · 正品直营 · 药师在线</span>
  </div>

  <div class="card">
    <div style="font-size:12.5px;color:var(--sub);margin-bottom:8px">选择头像</div>
    <div class="avatars">
      ${avatars.map((a,i) => `<div class="av2 ${state.tmpAvatar===i?'on':''}" onclick="A.avatar(${i})">${a}</div>`).join('')}
    </div>

    <div class="field"><label>昵称</label>
      <input id="inNick" placeholder="选填，默认「微信用户」" value="${state.tmpNick||''}"
             oninput="state.tmpNick=this.value"></div>

    <div class="field"><label>手机号</label>
      <input id="inPhone" type="tel" maxlength="11" placeholder="请输入 11 位手机号"
             value="${state.tmpPhone||''}" oninput="state.tmpPhone=this.value"></div>

    <div class="note">手机号仅用于登录与订单通知，本地演示不做上传</div>
  </div>

  <div class="agree" onclick="state.agree=!state.agree;render()">
    <div class="check ${state.agree?'on':''}">${state.agree?'✓':''}</div>
    <div>我已阅读并同意 <span class="link" onclick="event.stopPropagation();A.agreement()">《用户协议与隐私说明》</span></div>
  </div>

  <div class="actions2">
    <button class="btn primary" onclick="A.doLogin()">登录</button>
    <button class="btn ghost" onclick="A.fillDemo()">一键填入示例资料</button>
  </div>

  <div class="footnote">
    演示账号不会产生真实短信验证；正式项目建议使用 wx.login 换取 openid + 后端手机号解密，并做好频次限制与风控。
  </div>`;
}

/* ================= 交互 ================= */
const A = {
  tab(k){
    state.screen = k;
    state.tab = k;
    render();
  },
  cat(id){ state.cat = id; render(); },

  /** 搜索时只局部更新列表，避免整页重渲染打断中文输入法 */
  search(v){
    state.keyword = v;
    const wrap = $('gridWrap');
    const cnt = $('cnt');
    if (wrap) wrap.innerHTML = goodsGridHTML();
    if (cnt) cnt.textContent = '共 ' + filteredGoods().length + ' 件';
  },

  detail(id){ state.detailId = id; state.screen = 'detail'; render(); },
  back(){
    if (state.screen === 'confirm') { state.screen = 'cart'; state.tab = 'cart'; }
    else if (state.screen === 'login') { state.screen = state.loginBack || 'mine'; state.tab = state.loginBack || 'mine'; }
    else { state.screen = 'home'; state.tab = 'home'; }
    render();
  },

  add(id){
    const g = byId(id);
    const hit = state.cart.find(i => i.id === id);
    if (hit) hit.count = Math.min(hit.count + 1, 99);
    else state.cart.push({ id, count:1, selected:true });
    toast(g.rx ? '已加入，结算需上传处方' : '已加入购物车');
    render();
  },

  buyNow(id){
    A.add(id);
    state.screen = 'cart'; state.tab = 'cart'; render();
  },

  sel(id){
    const it = state.cart.find(i => i.id === id);
    it.selected = !it.selected; render();
  },
  selAll(){
    const all = state.cart.every(i => i.selected);
    state.cart.forEach(i => i.selected = !all); render();
  },
  step(id, d){
    const it = state.cart.find(i => i.id === id);
    it.count = Math.max(1, Math.min(99, it.count + d));
    if (it.count === 99 && d > 0) toast('单件最多 99 件');
    render();
  },
  del(id){
    if (!confirm('确定要删除这件药品吗？')) return;
    state.cart = state.cart.filter(i => i.id !== id);
    toast('已删除'); render();
  },

  checkout(){
    const sel = state.cart.filter(i => i.selected);
    if (!sel.length) return toast('请先勾选要结算的药品');
    if (!state.user){
      state.loginBack = 'cart';
      state.screen = 'login'; render(); return;
    }
    state.remark = ''; state.rxFile = false;
    state.screen = 'confirm'; render();
  },

  rx(){ state.rxFile = true; toast('处方已上传，待药师审核'); render(); },

  submit(){
    const items = state.cart.filter(i => i.selected);
    const hasRx = items.some(i => byId(i.id).rx);
    if (hasRx && !state.rxFile) return toast('含处方药，请先上传处方');

    const goods = items.reduce((s,i) => s + byId(i.id).price * i.count, 0);
    const freight = goods >= 99 ? 0 : 8;
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    state.orders.unshift({
      no: 'KN' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes()) + Math.floor(Math.random()*9000+1000),
      timeText: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`,
      status:'unpaid',
      items: items.map(i => ({ id:i.id, count:i.count })),
      total: m(goods + freight)
    });
    const ids = items.map(i => i.id);
    state.cart = state.cart.filter(i => !ids.includes(i.id));
    state.screen = 'orders'; state.tab = 'orders'; state.orderTab = 'all';
    render(); toast('下单成功');
  },

  orderTab(k){ state.orderTab = k; state.screen = 'orders'; state.tab='orders'; render(); },

  pay(no){
    if (!confirm('模拟支付：演示项目不接入真实支付，正式上线需调用 wx.requestPayment。')) return;
    state.orders.find(o => o.no === no).status = 'undelivered';
    toast('支付成功'); render();
  },
  cancel(no){
    if (!confirm('确定要取消这笔订单吗？')) return;
    state.orders.find(o => o.no === no).status = 'canceled';
    toast('订单已取消'); render();
  },
  ship(no){
    state.orders.find(o => o.no === no).status = 'shipping';
    toast('商家已发货（演示）'); render();
  },
  receive(no){
    if (!confirm('请确认已收到药品并核对无误。')) return;
    state.orders.find(o => o.no === no).status = 'done';
    toast('已确认收货'); render();
  },
  again(no){
    const o = state.orders.find(o => o.no === no);
    o.items.forEach(it => {
      const hit = state.cart.find(c => c.id === it.id);
      if (hit) hit.count = Math.min(hit.count + it.count, 99);
      else state.cart.push({ id:it.id, count:it.count, selected:true });
    });
    state.screen = 'cart'; state.tab = 'cart';
    render(); toast('已加入购物车');
  },

  login(){
    if (state.user) return;
    state.loginBack = state.tab || 'mine';
    state.screen = 'login'; render();
  },
  avatar(i){ state.tmpAvatar = i; render(); },
  fillDemo(){
    state.tmpNick = '微信用户_小城'; state.tmpPhone = '13800136688'; state.agree = true;
    render(); toast('已填入示例资料');
  },
  doLogin(){
    if (!state.agree) return toast('请先阅读并同意用户协议');
    if (!/^1[3-9]\d{9}$/.test(state.tmpPhone || '')) return toast('请输入正确的 11 位手机号');
    const avatars = ['🙂','🐻','🌿','🐱','🦊','🍀'];
    state.user = {
      nickname: (state.tmpNick || '').trim() || '微信用户',
      phone: state.tmpPhone,
      avatar: avatars[state.tmpAvatar || 0]
    };
    const back = state.loginBack || 'mine';
    state.screen = back; state.tab = back;
    render(); toast('登录成功');
  },
  logout(){
    if (!confirm('退出后购物车与订单记录仍保留在本地。')) return;
    state.user = null; toast('已退出登录'); render();
  },
  agreement(){
    alert('本演示小程序仅在本地保存昵称与手机号用于展示登录态，不上传服务器。\n\n真实项目应：\n① 明示收集目的与范围；\n② 提供隐私政策与撤回同意入口；\n③ 手机号等敏感信息加密存储；\n④ 不收集与购药无关的信息。');
  },
  help(){
    alert('常见问题\n\n1. 处方药如何购买？\n下单时上传处方，药师审核通过后发货。\n\n2. 药品能否退换？\n非质量问题拆封后不予退换。\n\n3. 多久发货？\n现货 24 小时内发出。');
  },
  about(){
    alert('康宁大药房（演示项目）\n\n本小程序为教学/演示用途，商品与资质信息均为示例数据，不提供真实销售服务。');
  },
  toast
};

/* 初始化：预置一个待收货订单，方便查看订单页 */
(function init(){
  state.tmpAvatar = 0; state.agree = false;
  render();
})();
</script>
</body>
